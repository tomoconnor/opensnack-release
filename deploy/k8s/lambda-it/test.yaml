apiVersion: v1
kind: Namespace
metadata:
  name: opensnack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: opensnack
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_PASSWORD, value: opensnack }
            - { name: POSTGRES_DB, value: opensnack }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: opensnack
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
# The AWS API: in-cluster for functions' SDK calls, and on a NodePort that
# k3d maps to the test host.
apiVersion: v1
kind: Service
metadata:
  name: opensnack
  namespace: opensnack
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: opensnack
  ports:
    - name: api
      port: 4566
      targetPort: api
      nodePort: 30566
---
# Two tenants in different accounts.
apiVersion: v1
kind: Secret
metadata:
  name: opensnack-credentials
  namespace: opensnack
stringData:
  credentials.json: |
    [
      {"access_key_id": "AKIAITTENANTA0000001", "secret_access_key": "tenant-a-secret", "account_id": "111111111111", "namespace": "it-tenant-a"},
      {"access_key_id": "AKIAITTENANTB0000001", "secret_access_key": "tenant-b-secret", "account_id": "222222222222", "namespace": "it-tenant-b"}
    ]
