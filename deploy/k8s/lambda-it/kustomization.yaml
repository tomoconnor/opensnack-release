# The example manifests plus what the integration tests need: an opensnack
# namespace, Postgres, a NodePort for the tests to reach opensnack, test
# credentials, and locally built images. run.sh applies it to a throwaway
# k3d cluster. The default runtime (runc) stands in for a sandboxing
# RuntimeClass.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../lambda
  - test.yaml
patches:
  - path: deployment-patch.yaml
