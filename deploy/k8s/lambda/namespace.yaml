# The namespace opensnack's Lambda sandbox pods run in. The "restricted"
# Pod Security Standard rejects any pod that isn't locked down the way the
# executor builds them.
apiVersion: v1
kind: Namespace
metadata:
  name: opensnack-lambda
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
