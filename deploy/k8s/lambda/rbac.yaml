# opensnack's own service account (here "opensnack" in the "opensnack"
# namespace) may manage pods in the sandbox namespace, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opensnack-lambda-executor
  namespace: opensnack-lambda
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opensnack-lambda-executor
  namespace: opensnack-lambda
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opensnack-lambda-executor
subjects:
  - kind: ServiceAccount
    name: opensnack
    namespace: opensnack
