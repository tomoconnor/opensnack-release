# On every push to main, asks Advent of Terraform's private build to make
# images of this commit. The build, its tests and the AWS access all live
# there; this repo holds only a token that can start workflows in that one
# repository (fine-grained, Actions: write). Forks never see the secret.
name: aotf-images

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: github.repository == 'tomoconnor/opensnack-release'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.AOTF_DISPATCH_TOKEN }}
        run: gh workflow run opensnack-images.yml -R AdventOfTerraform/backend -f commit="$GITHUB_SHA"
